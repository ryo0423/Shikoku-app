<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="icon" href="icon_p5isekai.jpeg">
    <link rel="apple-touch-icon" href="icon_p5isekai.jpeg">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>資格学習プロ | STYLISH EDITION</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { 
            --primary: #D31212; 
            --bg: #121212;      
            --card: #FFFFFF;    
            --text: #000000; 
            --accent: #E1E1E1;
            --error: #D31212;
            --success: #28a745;
        }

        body { 
            font-family: 'Arial Black', 'Helvetica Neue', sans-serif; 
            background-color: var(--bg); 
            background-image: radial-gradient(circle at 10% 20%, rgba(211, 18, 18, 0.15) 0%, transparent 40%);
            margin: 0; 
            display: flex; 
            justify-content: center; 
            overflow-x: hidden; 
            color: white;
        }

        .container { width: 100%; max-width: 500px; padding: 20px; position: relative; padding-bottom: 80px; }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 50px;
            margin-bottom: 20px;
        }

        .back-btn { 
            background: white; color: black; border: 3px solid black; padding: 8px 18px;
            font-weight: bold; transform: skew(-15deg); cursor: pointer; display: none;
            box-shadow: 4px 4px 0 var(--primary);
        }
        .back-btn:hover { background: var(--primary); color: white; }

        .progress-indicator {
            background: var(--primary); color: white; padding: 6px 15px;
            font-size: 14px; transform: skew(10deg); font-weight: 900;
            box-shadow: 4px 4px 0 black;
        }

        .settings-btn { 
            width: 40px; height: 40px; background: white; border: 3px solid black; 
            display: none; align-items: center; justify-content: center; cursor: pointer;
            transform: rotate(5deg); box-shadow: 4px 4px 0 var(--primary);
        }
        .settings-icon-bar, .settings-icon-bar::before, .settings-icon-bar::after {
            content: ""; width: 20px; height: 3px; background: black; position: absolute;
        }
        .settings-icon-bar::before { top: -7px; }
        .settings-icon-bar::after { top: 7px; }

        .card { 
            background: var(--card); color: var(--text); padding: 30px 20px;
            box-shadow: 10px 10px 0px var(--primary);
            position: relative; border: 4px solid black;
            min-height: 400px;
        }

        h1 { background: black; color: white; display: inline-block; padding: 5px 20px; transform: rotate(-2deg); font-size: 24px; font-weight: 900; margin-bottom: 20px; }

        .stats-container { background: #000; padding: 15px; margin-bottom: 20px; display: flex; justify-content: space-around; transform: skew(-5deg); box-shadow: 4px 4px 0 var(--primary); }
        .stats-item { color: white; text-align: center; font-size: 10px; font-weight: bold; letter-spacing: 1px; }
        .stats-item b { font-size: 20px; color: var(--primary); display: block; margin-top: 5px; font-weight: 900;}

        .mode-toggle { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; }
        .toggle-btn { 
            background: black; color: white; border: 2px solid black; padding: 10px 20px;
            font-weight: 900; cursor: pointer; transform: skew(-10deg); transition: 0.2s;
        }
        .toggle-btn.active { 
            background: var(--primary); border-color: var(--primary); color: white;
            box-shadow: 4px 4px 0 black;
        }

        #q-text { 
            font-size: 20px; text-align: left; margin: 20px 0; font-weight: 900; 
            line-height: 1.4; border-left: 8px solid var(--primary); padding-left: 15px;
        }

        .option-btn, .menu-btn { 
            width: 100%; border: 3px solid black;
            text-align: left; font-size: 16px; font-weight: 900;
            cursor: pointer; transition: 0.15s;
        }
        .option-btn { padding: 18px; margin-top: 12px; background: white; color: black; }
        .menu-btn { padding: 20px; margin-bottom: 15px; border: none; background: black; color: white; font-size: 18px; transform: skew(-10deg); text-align: center; }

        .option-btn:hover, .menu-btn:hover { 
            background: var(--primary) !important; 
            color: white !important; 
            transform: translate(-3px, -3px) skew(-10deg); 
            box-shadow: 6px 6px 0 black; 
        }

        .wrong .menu-btn.primary { 
            background: var(--primary); color: white; 
            box-shadow: 4px 4px 0 white;
            margin-top: 20px;
        }
        .wrong .menu-btn.primary:hover { background: white; color: black; box-shadow: 6px 6px 0 var(--primary); }

        .result { margin-top: 25px; padding: 20px; border: 4px solid black; font-weight: 900; transform: rotate(1deg); }
        .correct { background: white; color: var(--success); border-color: var(--success); }
        .wrong { background: black; color: white; border-color: var(--primary); }

        .weak-action-area { display: flex; gap: 10px; margin-top: 15px; }
        .wrong .weak-action-area .menu-btn { border-color: white; color: white; }
        .wrong .weak-action-area .menu-btn.outline:hover { background: white; color: black; }

        #settings-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(211, 18, 18, 0.8); display: none; justify-content: center; align-items: center; z-index: 200; }
        .modal-content { background: black; padding: 30px; border: 5px solid white; width: 85%; max-width: 320px; text-align: center; color: white; transform: rotate(-2deg); box-shadow: 10px 10px 0 black; }

        .volume-control { margin: 25px 0; text-align: left; }
        .volume-label { font-size: 14px; font-weight: 900; margin-bottom: 10px; display: block; letter-spacing: 2px; }
        .slider { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; background: #444; outline: none; border: 2px solid white; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; background: white; cursor: pointer; border: 3px solid var(--primary); border-radius: 50%; }

        .timer-container { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #000; border-top: 4px solid var(--primary); display: flex; align-items: center; justify-content: center; z-index: 100; box-shadow: 0 -5px 15px rgba(211,18,18,0.2); }
        .timer-bar { position: absolute; top: 0; left: 0; height: 100%; background: var(--primary); width: 100%; opacity: 0.5; }

        .correct-anime { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 250px; height: 250px; border: 25px solid var(--success); border-radius: 50%; pointer-events: none; z-index: 1000; opacity: 0; }
        .run-anime { animation: p5-circle 0.4s ease-out forwards; }
        @keyframes p5-circle { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 50% { opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; } }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px) rotate(-1deg); } 75% { transform: translateX(10px) rotate(1deg); } }
        .shake { animation: shake 0.15s ease-in-out 0s 2; border: 6px solid var(--primary); }
        
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="circle-anime" class="correct-anime"></div>

<div id="settings-modal" onclick="closeSettings()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2 style="font-size: 30px; margin-bottom: 30px; font-weight: 900;">CONFIG</h2>
        <div class="volume-control">
            <span class="volume-label">BGM VOLUME</span>
            <input type="range" min="0" max="1" step="0.01" value="0.08" class="slider" id="bgm-slider" oninput="updateBgmVolume(this.value)">
        </div>
        <div class="volume-control">
            <span class="volume-label">SE VOLUME</span>
            <input type="range" min="0" max="1" step="0.01" value="0.5" class="slider" id="se-slider" oninput="updateSeVolume(this.value)">
        </div>
        <button class="menu-btn primary" style="margin-top:20px" onclick="closeSettings()">RESUME</button>
    </div>
</div>

<div class="container">
    <header class="app-header">
        <button id="global-back-btn" class="back-btn" onclick="clickWrapper(() => goBack())">◀ BACK</button>
        <div id="progress-indicator" class="progress-indicator hidden">Q: 1 / 10</div>
        <button id="global-settings-btn" class="settings-btn" onclick="openSettings()"><div class="settings-icon-bar"></div></button>
    </header>

    <div id="genre-screen" class="card">
        <h1>TAKE YOUR TIME</h1>
        
        <div class="stats-container">
            <div class="stats-item">TOTAL RECORD<b><span id="total-count">0</span></b></div>
            <div class="stats-item">SUCCESS RATE<b><span id="total-rate">0%</span></b></div>
            <div class="stats-item">WEAK BOX<b><span id="weak-total-count">0</span></b></div>
        </div>

        <div class="mode-toggle">
            <button id="mode-on" class="toggle-btn active" onclick="clickWrapper(() => setTimerMode(true))">TIMER ON</button>
            <button id="mode-off" class="toggle-btn" onclick="clickWrapper(() => setTimerMode(false))">TIMER OFF</button>
        </div>

        <button class="menu-btn primary" onclick="handleStart('TOEIC')">TOEIC</button>
        <button class="menu-btn primary" onclick="handleStart('FE')">基本情報技術者</button>
        <button class="menu-btn primary" onclick="handleStart('AWS')">AWS SAA</button>
        <button class="menu-btn primary" onclick="handleStart('VBA')">EXCEL VBA</button>
        
        <button onclick="clickWrapper(() => resetStats())" style="margin-top:25px; background:none; border:none; color:black; font-size:12px; text-decoration:underline; width:100%; cursor:pointer; font-weight:bold;">ERASE ALL DATA</button>
    </div>

    <div id="sub-genre-screen" class="card hidden">
        <h1 id="sub-title">GENRE</h1>
        <div id="sub-menu-list" style="margin-top:25px"></div>
    </div>

    <div id="quiz-screen" class="card hidden">
        <div id="q-text"></div>
        <div id="options-list"></div>
        <div id="result-box" class="result hidden">
            <div id="ans-status" style="font-size:24px"></div>
            <div id="ans-desc" style="font-weight: 900; font-size: 15px; margin-top: 12px; line-height:1.6;"></div>
            
            <div id="normal-action" class="hidden">
                <button class="menu-btn primary" onclick="nextStep()">NEXT</button>
            </div>
            
            <div id="weak-correct-action" class="hidden">
                <p style="color:red; margin:15px 0; font-weight:900;">DELETE FROM WEAK BOX?</p>
                <div class="weak-action-area">
                    <button class="menu-btn outline" style="flex:1" onclick="stayInWeakness()">KEEP</button>
                    <button class="menu-btn primary" style="flex:1" onclick="resolveWeakness()">ERASE</button>
                </div>
            </div>
        </div>
    </div>

    <div id="checkpoint-screen" class="card hidden">
        <h1>RESULT</h1>
        <div id="checkpoint-stats" style="font-size: 30px; font-weight: 900; margin: 40px 0; color:black; text-shadow: 2px 2px 0 var(--primary);"></div>
        <div id="retry-section" class="hidden">
            <button class="menu-btn" style="background:#000" onclick="clickWrapper(() => startRetry())">RETRY WRONG QUESTIONS</button>
        </div>
        <button id="next-set-btn" class="menu-btn primary" onclick="continueNext()">NEXT 10 QUESTIONS</button>
        <button class="menu-btn" style="background:none; color:black; border:2px solid black;" onclick="clickWrapper(() => goBack())">BACK TO MENU</button>
    </div>
</div>

<div id="timer-ui" class="timer-container hidden">
    <div id="timer-bar" class="timer-bar"></div>
    <div style="position:relative; font-size:28px; font-weight:900;">TIME: <span id="timer-num">30.0</span></div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const soundBuffers = {};
    let bgmVolume = 0.08, seVolume = 0.5, bgmSource = null, bgmGainNode = null, audioInitialized = false;

    async function loadSound(name, url) {
        try {
            const response = await fetch(url);
            const arrayBuffer = await response.arrayBuffer();
            soundBuffers[name] = await audioCtx.decodeAudioData(arrayBuffer);
        } catch (e) { console.error("Load failed:", name); }
    }

    function playSE(name) {
        if (!soundBuffers[name]) return;
        const source = audioCtx.createBufferSource();
        source.buffer = soundBuffers[name];
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = seVolume;
        source.connect(gainNode).connect(audioCtx.destination);
        source.start(0);
    }

    function clickWrapper(callback) { playSE('select'); if (callback) callback(); }

    function startBGM() {
        if (bgmVolume === 0 || !soundBuffers['bgm']) return;
        if (bgmSource) return;
        bgmSource = audioCtx.createBufferSource();
        bgmSource.buffer = soundBuffers['bgm'];
        bgmSource.loop = true;
        bgmGainNode = audioCtx.createGain();
        bgmGainNode.gain.value = bgmVolume;
        bgmSource.connect(bgmGainNode).connect(audioCtx.destination);
        bgmSource.start(0);
    }

    function stopBGM() { if (bgmSource) { try { bgmSource.stop(); } catch(e){} bgmSource = null; bgmGainNode = null; } }
    function updateBgmVolume(val) {
        bgmVolume = parseFloat(val);
        if (bgmGainNode) bgmGainNode.gain.value = bgmVolume;
        if (bgmVolume > 0 && !bgmSource && !document.getElementById('quiz-screen').classList.contains('hidden')) startBGM();
        else if (bgmVolume === 0) stopBGM();
    }
    function updateSeVolume(val) { seVolume = parseFloat(val); }

    loadSound('bgm', './assets/sounds/BGM/persona5_style_music.mp3');
    loadSound('correct', './assets/sounds/SE/correct.mp3');
    loadSound('wrong', './assets/sounds/SE/noncorrect.mp3');
    loadSound('select', './assets/sounds/SE/select.mp3');

    function openSettings() { playSE('select'); document.getElementById('settings-modal').style.display = 'flex'; }
    function closeSettings() { playSE('select'); document.getElementById('settings-modal').style.display = 'none'; }

    let stats = JSON.parse(localStorage.getItem('shikaku_stats')) || { totalAsked: 0, totalCorrect: 0 };
    let weaknessPool = JSON.parse(localStorage.getItem('shikaku_weakness')) || [];
    let isTimerEnabled = true, pool = [], currentSet = [], wrongQuestions = [], currentIdx = 0, timerInterval, timeLeft = 30;
    let isRetryMode = false, isWeaknessMode = false, currentCategory = '', setCorrectCount = 0;

    function updateMainStatsDisplay() {
        document.getElementById('total-count').innerText = stats.totalAsked;
        const rate = stats.totalAsked === 0 ? 0 : Math.round((stats.totalCorrect / stats.totalAsked) * 100);
        document.getElementById('total-rate').innerText = rate + "%";
        document.getElementById('weak-total-count').innerText = weaknessPool.length;
    }
    updateMainStatsDisplay();

    function setTimerMode(enabled) {
        isTimerEnabled = enabled;
        document.getElementById('mode-on').classList.toggle('active', enabled);
        document.getElementById('mode-off').classList.toggle('active', !enabled);
    }

    function handleStart(category) {
        if (!audioInitialized) { audioCtx.resume(); audioInitialized = true; }
        currentCategory = category;
        clickWrapper(() => {
            document.getElementById('global-back-btn').style.display = 'block';
            showSubGenre(category);
        });
    }

    const subGenres = {
        'TOEIC': [{ name: '動詞', file: 'TOEIC/verbs.csv' }, { name: '前置詞', file: 'TOEIC/prepositions.csv' }, { name: '副詞', file: 'TOEIC/adverbs.csv' }, { name: '形容詞', file: 'TOEIC/adjectives.csv' }],
        'FE': [{ name: 'ネットワーク', file: 'FE/network.csv' }, { name: 'セキュリティ', file: 'FE/security.csv' }],
        'AWS': [{ name: 'Compute/EC2', file: 'AWS/ec2.csv' }, { name: 'Storage/S3', file: 'AWS/s3.csv' }, { name: 'Security/IAM', file: 'AWS/iam.csv' }, { name: 'Database/RDS', file: 'AWS/rds.csv' }, { name: 'Network/VPC', file: 'AWS/networking.csv' }, { name: 'Serverless/Integration', file: 'AWS/serverles.csv' }, { name: 'Management/Monitoring', file: 'AWS/monitoring.csv' }, { name: '総合演習/Final', file: 'AWS/final.csv' }],
        'VBA': [{ name: 'VBA 基礎', file: 'VBA/basic.csv' }]
    };

    function showSubGenre(category) {
        document.getElementById('genre-screen').classList.add('hidden');
        document.getElementById('sub-genre-screen').classList.remove('hidden');
        document.getElementById('sub-title').innerText = category;
        const list = document.getElementById('sub-menu-list');
        list.innerHTML = '';
        const categoryWeakness = weaknessPool.filter(q => q.category === category);
        if (categoryWeakness.length > 0) {
            const weakBtn = document.createElement('button');
            weakBtn.className = 'menu-btn warning';
            weakBtn.innerText = `RECOVER WEAKNESS (${categoryWeakness.length})`;
            weakBtn.onclick = () => clickWrapper(() => startWeaknessMode(category));
            list.appendChild(weakBtn);
        }
        subGenres[category].forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'menu-btn primary'; btn.innerText = item.name; 
            btn.onclick = () => clickWrapper(() => loadCSV(item.file)); list.appendChild(btn);
        });
    }

    function loadCSV(path) { Papa.parse(`questions/${path}`, { download: true, header: true, skipEmptyLines: true, complete: results => { pool = results.data.sort(() => Math.random() - 0.5); startNewSet(); } }); }
    function startNewSet() { isRetryMode = false; isWeaknessMode = false; wrongQuestions = []; setCorrectCount = 0; currentSet = pool.splice(0, 10); if (currentSet.length === 0) { goBack(); return; } currentIdx = 0; showQuiz(); }
    function showQuiz() { document.getElementById('sub-genre-screen').classList.add('hidden'); document.getElementById('checkpoint-screen').classList.add('hidden'); document.getElementById('quiz-screen').classList.remove('hidden'); document.getElementById('progress-indicator').classList.remove('hidden'); document.getElementById('global-settings-btn').style.display = 'flex'; if (isTimerEnabled) document.getElementById('timer-ui').classList.remove('hidden'); startBGM(); renderQuestion(); }
    function renderQuestion() { cancelAnimationFrame(timerInterval); const qScreen = document.getElementById('quiz-screen'); qScreen.classList.remove('shake'); document.getElementById('result-box').classList.add('hidden'); const q = currentSet[currentIdx]; document.getElementById('progress-indicator').innerText = `Q: ${currentIdx + 1} / ${currentSet.length}`; document.getElementById('q-text').innerText = q.question; const list = document.getElementById('options-list'); list.innerHTML = ''; [1,2,3,4].forEach(num => { if (q[`option${num}`]) { const b = document.createElement('button'); b.className = 'option-btn'; b.innerText = q[`option${num}`]; b.onclick = () => checkAnswer(num, q); list.appendChild(b); } }); if (isTimerEnabled) startSmoothTimer(); }
    function startSmoothTimer() { const duration = 30000; const startTimestamp = performance.now(); function update(now) { const elapsed = now - startTimestamp; const remaining = Math.max(0, duration - elapsed); timeLeft = remaining / 1000; updateTimerUI(); if (remaining > 0) { timerInterval = requestAnimationFrame(update); } else { checkAnswer(-1, currentSet[currentIdx]); } } timerInterval = requestAnimationFrame(update); }
    function updateTimerUI() { const percent = (timeLeft / 30) * 100; document.getElementById('timer-bar').style.width = percent + "%"; document.getElementById('timer-num').innerText = timeLeft.toFixed(1); }
    function checkAnswer(selected, q) { 
        cancelAnimationFrame(timerInterval); 
        const isCorrect = (selected == q.answer); 
        const circle = document.getElementById('circle-anime'); 
        if (isCorrect) { 
            playSE('correct'); circle.classList.add('run-anime'); setTimeout(() => circle.classList.remove('run-anime'), 500); 
            if (!isRetryMode && !isWeaknessMode) setCorrectCount++; 
        } else { 
            playSE('wrong'); document.getElementById('quiz-screen').classList.add('shake'); 
            if (!isRetryMode) { 
                const exists = weaknessPool.some(item => item.question === q.question); 
                if (!exists) { weaknessPool.push({ ...q, category: currentCategory }); localStorage.setItem('shikaku_weakness', JSON.stringify(weaknessPool)); updateMainStatsDisplay(); } 
                wrongQuestions.push(q); 
            } 
        } 
        const rb = document.getElementById('result-box'); 
        rb.classList.remove('hidden'); rb.className = `result ${isCorrect ? 'correct' : 'wrong'}`; 
        document.getElementById('ans-status').innerText = isCorrect ? "SUCCESS!!" : "FAILED..."; 
        document.getElementById('ans-desc').innerText = q.explanation; 
        if (isWeaknessMode && isCorrect) { document.getElementById('normal-action').classList.add('hidden'); document.getElementById('weak-correct-action').classList.remove('hidden'); } 
        else { document.getElementById('normal-action').classList.remove('hidden'); document.getElementById('weak-correct-action').classList.add('hidden'); } 
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true); 
    }
    function nextStep() { currentIdx++; if (currentIdx < currentSet.length) renderQuestion(); else showCheckpoint(); }
    function showCheckpoint() { if (!isRetryMode && !isWeaknessMode) { stats.totalAsked += currentSet.length; stats.totalCorrect += setCorrectCount; localStorage.setItem('shikaku_stats', JSON.stringify(stats)); updateMainStatsDisplay(); } document.getElementById('quiz-screen').classList.add('hidden'); document.getElementById('timer-ui').classList.add('hidden'); document.getElementById('progress-indicator').classList.add('hidden'); document.getElementById('global-settings-btn').style.display = 'none'; document.getElementById('checkpoint-screen').classList.remove('hidden'); const count = isWeaknessMode ? (currentSet.length - wrongQuestions.length) : setCorrectCount; document.getElementById('checkpoint-stats').innerHTML = `${count} / ${currentSet.length} CLEAR`; document.getElementById('retry-section').className = (!isRetryMode && wrongQuestions.length > 0) ? '' : 'hidden'; document.getElementById('next-set-btn').style.display = isWeaknessMode ? 'none' : 'block'; }
    function goBack() { cancelAnimationFrame(timerInterval); stopBGM(); location.reload(); }
    function startRetry() { isRetryMode = true; currentSet = [...wrongQuestions]; wrongQuestions = []; currentIdx = 0; showQuiz(); }
    function continueNext() { startNewSet(); }
    function startWeaknessMode(category) { isWeaknessMode = true; isRetryMode = false; const targetWeakness = weaknessPool.filter(q => q.category === category); currentSet = targetWeakness.sort(() => Math.random() - 0.5).slice(0, 10); currentIdx = 0; wrongQuestions = []; setCorrectCount = 0; showQuiz(); }
    function resolveWeakness() { const currentQ = currentSet[currentIdx]; weaknessPool = weaknessPool.filter(item => item.question !== currentQ.question); localStorage.setItem('shikaku_weakness', JSON.stringify(weaknessPool)); updateMainStatsDisplay(); nextStep(); }
    function stayInWeakness() { nextStep(); }
    function resetStats() { if(confirm("ERASE ALL RECORDS?")) { stats = { totalAsked: 0, totalCorrect: 0 }; weaknessPool = []; localStorage.setItem('shikaku_stats', JSON.stringify(stats)); localStorage.setItem('shikaku_weakness', JSON.stringify(weaknessPool)); updateMainStatsDisplay(); } }
</script>
</body>
</html>
