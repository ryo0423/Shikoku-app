<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>資格学習プロ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --primary: #007AFF; --bg: #F2F2F7; --card: #FFFFFF; --text: #1C1C1E; --error: #FF3B30; --success: #28a745; --gray: #8E8E93; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; overflow-x: hidden; }
        .container { width: 100%; max-width: 450px; position: relative; padding-bottom: 60px; }
        .card { background: var(--card); border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-align: center; min-height: 350px; position: relative; }
        
        /* 統計エリアのスタイル */
        .stats-container { background: #E5E5EA; border-radius: 12px; padding: 10px; margin-bottom: 20px; display: flex; justify-content: space-around; font-size: 13px; color: var(--text); }
        .stats-item b { font-size: 16px; color: var(--primary); display: block; }

        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .slide-in { animation: slideIn 0.3s ease-out; }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-8px); } 100% { transform: translateX(0); } }
        .shake { animation: shake 0.2s ease-in-out 0s 2; border: 2px solid var(--error); }
        @keyframes correctCircle { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 30% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; } 100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } }
        .correct-anime { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 200px; height: 200px; border: 20px solid var(--error); border-radius: 50%; pointer-events: none; z-index: 1000; opacity: 0; }
        .run-anime { animation: correctCircle 0.6s ease-out; }
        .back-btn { position: absolute; top: 10px; left: 10px; background: none; border: none; color: var(--primary); font-size: 16px; cursor: pointer; display: none; z-index: 10; }
        
        .timer-container { position: fixed; bottom: 0; left: 0; width: 100%; height: 50px; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; z-index: 100; }
        .timer-bar { position: absolute; top: 0; right: 0; height: 100%; background: var(--primary); width: 100%; transition: width 1s linear; opacity: 0.6; }
        .timer-text { position: relative; font-weight: bold; font-size: 18px; z-index: 101; }
        #timer-num.urgent-text { color: var(--error); text-shadow: 0 0 10px var(--error); animation: blink 0.5s infinite alternate; }
        @keyframes blink { from { opacity: 1; } to { opacity: 0.5; } }

        .menu-btn { width: 100%; padding: 16px; margin-bottom: 10px; border: none; border-radius: 12px; background: #E5E5EA; color: var(--text); font-size: 16px; font-weight: 600; cursor: pointer; }
        .menu-btn.primary { background: var(--primary); color: white; }
        .option-btn { width: 100%; padding: 16px; margin-top: 10px; border: 2px solid #E5E5EA; border-radius: 12px; background: white; text-align: left; font-size: 15px; }
        .hidden { display: none; }
        .result { margin-top: 20px; padding: 15px; border-radius: 12px; font-weight: bold; }
        .correct { background: #E2F9E1; color: var(--success); }
        .wrong { background: #FFF0F0; color: var(--error); }
        .mode-toggle { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .toggle-btn { padding: 8px 16px; border-radius: 20px; border: 2px solid var(--primary); background: transparent; color: var(--primary); font-weight: bold; cursor: pointer; font-size: 12px; }
        .toggle-btn.active { background: var(--primary); color: white; }
    </style>
</head>
<body>

<div id="circle-anime" class="correct-anime"></div>

<div class="container">
    <button id="global-back-btn" class="back-btn" onclick="goBack()">◀ 戻る</button>

    <div id="genre-screen" class="card">
        <h1>学習を開始</h1>
        
        <div class="stats-container">
            <div class="stats-item">通算回答<b id="total-count">0</b></div>
            <div class="stats-item">総合正答率<b id="total-rate">0%</b></div>
        </div>

        <p style="font-size: 13px; color: var(--gray);">タイマー設定</p>
        <div class="mode-toggle">
            <button id="mode-on" class="toggle-btn active" onclick="setTimerMode(true)">あり (30秒)</button>
            <button id="mode-off" class="toggle-btn" onclick="setTimerMode(false)">なし</button>
        </div>
        <button class="menu-btn primary" onclick="handleStart('TOEIC')">🔤 TOEIC</button>
        <button class="menu-btn primary" onclick="handleStart('FE')">💻 基本情報技術者</button>
        <button class="menu-btn primary" onclick="handleStart('AWS')">☁️ AWS SAA</button>
        <button class="menu-btn primary" onclick="handleStart('VBA')">📊 Excel VBA</button>
        
        <button onclick="resetStats()" style="margin-top:20px; background:none; border:none; color:var(--gray); font-size:11px; text-decoration:underline;">記録をリセットする</button>
    </div>

    <div id="sub-genre-screen" class="card hidden">
        <h1 id="sub-title">ジャンル</h1>
        <div id="sub-menu-list"></div>
    </div>

    <div id="quiz-screen" class="card hidden">
        <div id="progress-text" style="font-size: 12px; color: #8E8E93; margin-bottom: 5px;"></div>
        <div id="q-text" style="font-size: 18px; text-align: left; margin-bottom: 20px; font-weight: bold;"></div>
        <div id="options-list"></div>
        <div id="result-box" class="result hidden">
            <span id="ans-status"></span>
            <div id="ans-desc" style="font-weight: normal; font-size: 13px; margin-top: 10px;"></div>
            <button class="menu-btn primary" style="margin-top: 15px;" onclick="nextStep()">次へ</button>
        </div>
    </div>

    <div id="checkpoint-screen" class="card hidden">
        <h1>チェックポイント</h1>
        <div id="checkpoint-stats" style="font-size: 20px; font-weight: bold; margin: 20px 0;"></div>
        <div id="retry-section" class="hidden">
            <button class="menu-btn primary" onclick="startRetry()">❌ 間違えた問題だけ解き直す</button>
        </div>
        <button class="menu-btn" onclick="continueNext()">⏩ 次の10問へ進む</button>
        <button class="menu-btn" style="background:none; color:var(--primary)" onclick="goBack()">メニューに戻る</button>
    </div>
</div>

<div id="timer-ui" class="timer-container hidden">
    <div id="timer-bar" class="timer-bar"></div>
    <div class="timer-text" id="timer-label">TIME: <span id="timer-num">30</span></div>
</div>

<script>
    const sndBgm = new Audio();
    const sndCorrect = new Audio();
    const sndWrong = new Audio();

    sndBgm.src = 'assets/sounds/BGM/Bubble_soda.mp3';
    sndCorrect.src = 'assets/sounds/SE/correct.mp3';
    sndWrong.src = 'assets/sounds/SE/noncorrect.mp3';

    sndBgm.loop = true;
    const MAX_BGM_VOL = 0.3;
    const MIN_BGM_VOL = 0.05;
    let audioInitialized = false;
    let isTimerEnabled = true;

    // --- 統計用データ ---
    let stats = JSON.parse(localStorage.getItem('shikaku_stats')) || { totalAsked: 0, totalCorrect: 0 };

    function updateMainStatsDisplay() {
        document.getElementById('total-count').innerText = stats.totalAsked;
        const rate = stats.totalAsked === 0 ? 0 : Math.round((stats.totalCorrect / stats.totalAsked) * 100);
        document.getElementById('total-rate').innerText = rate + "%";
    }

    function saveStats(asked, correct) {
        stats.totalAsked += asked;
        stats.totalCorrect += correct;
        localStorage.setItem('shikaku_stats', JSON.stringify(stats));
        updateMainStatsDisplay();
    }

    function resetStats() {
        if(confirm("これまでの学習記録をすべて消去しますか？")) {
            stats = { totalAsked: 0, totalCorrect: 0 };
            localStorage.setItem('shikaku_stats', JSON.stringify(stats));
            updateMainStatsDisplay();
        }
    }

    // 初期表示
    updateMainStatsDisplay();

    function setTimerMode(enabled) {
        isTimerEnabled = enabled;
        document.getElementById('mode-on').classList.toggle('active', enabled);
        document.getElementById('mode-off').classList.toggle('active', !enabled);
    }

    function handleStart(category) {
        if (!audioInitialized) {
            sndBgm.load(); sndCorrect.load(); sndWrong.load();
            const promise = sndBgm.play();
            if (promise !== undefined) promise.then(_ => { sndBgm.pause(); }).catch(e => console.log(e));
            audioInitialized = true;
        }
        showSubGenre(category);
    }

    let pool = [], currentSet = [], wrongQuestions = [], currentIdx = 0, timerInterval, timeLeft = 30, isRetryMode = false;
    let setCorrectCount = 0; // そのセットでの正解数

    function fadeBgm(targetVolume, duration = 1000) {
        const startVolume = sndBgm.volume;
        const startTime = performance.now();
        function updateVolume(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            sndBgm.volume = startVolume + (targetVolume - startVolume) * progress;
            if (progress < 1) requestAnimationFrame(updateVolume);
        }
        requestAnimationFrame(updateVolume);
    }

    const subGenres = {
        'TOEIC': [{ name: '動詞問題', file: 'TOEIC/verbs.csv' }, { name: '前置詞問題', file: 'TOEIC/prepositions.csv' }, { name: '副詞問題', file: 'TOEIC/adverbs.csv' }, { name: '形容詞問題', file: 'TOEIC/adjectives.csv' }],
        'FE': [{ name: 'ネットワーク', file: 'FE/network.csv' }, { name: 'セキュリティ', file: 'FE/security.csv' }],
        'AWS': [{ name: 'Compute/EC2', file: 'AWS/ec2.csv' }, { name: 'Storage/S3', file: 'AWS/s3.csv' }, { name: 'Security/IAM', file: 'AWS/iam.csv' }, { name: 'Database/RDS', file: 'AWS/rds.csv' }],
        'VBA': [{ name: 'VBA 基礎', file: 'VBA/basic.csv' }]
    };

    function showSubGenre(category) {
        document.getElementById('genre-screen').classList.add('hidden');
        document.getElementById('sub-genre-screen').classList.remove('hidden');
        document.getElementById('global-back-btn').style.display = 'block';
        document.getElementById('sub-title').innerText = category;
        const list = document.getElementById('sub-menu-list');
        list.innerHTML = '';
        subGenres[category].forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'menu-btn primary'; 
            btn.innerText = item.name; 
            btn.onclick = () => loadCSV(item.file); 
            list.appendChild(btn);
        });
    }

    function loadCSV(path) {
        Papa.parse(`questions/${path}`, {
            download: true, header: true, skipEmptyLines: true,
            complete: function(results) {
                pool = results.data.sort(() => Math.random() - 0.5);
                startNewSet();
            }
        });
    }

    function startNewSet() {
        isRetryMode = false; wrongQuestions = []; setCorrectCount = 0;
        currentSet = pool.splice(0, 10);
        if (currentSet.length === 0) { goBack(); return; }
        currentIdx = 0;
        showQuiz();
    }

    function showQuiz() {
        document.getElementById('sub-genre-screen').classList.add('hidden');
        document.getElementById('checkpoint-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        if (isTimerEnabled) document.getElementById('timer-ui').classList.remove('hidden');
        else document.getElementById('timer-ui').classList.add('hidden');
        sndBgm.volume = 0;
        sndBgm.play().catch(e => console.error(e));
        fadeBgm(MAX_BGM_VOL, 1500);
        renderQuestion();
    }

    function renderQuestion() {
        clearInterval(timerInterval);
        const quizScreen = document.getElementById('quiz-screen');
        quizScreen.classList.remove('shake', 'slide-in');
        void quizScreen.offsetWidth;
        quizScreen.classList.add('slide-in');
        document.getElementById('result-box').classList.add('hidden');
        const q = currentSet[currentIdx];
        document.getElementById('progress-text').innerText = `${isRetryMode ? '【解き直し】' : 'セット'} : ${currentIdx + 1} / ${currentSet.length}`;
        document.getElementById('q-text').innerText = q.question;
        const list = document.getElementById('options-list');
        list.innerHTML = '';
        [1,2,3,4].forEach(num => {
            if (q[`option${num}`]) {
                const b = document.createElement('button');
                b.className = 'option-btn'; b.innerText = q[`option${num}`];
                b.onclick = () => checkAnswer(num, q);
                list.appendChild(b);
            }
        });
        if (isTimerEnabled) startTimer();
    }

    function startTimer() {
        timeLeft = 30; updateTimerUI();
        timerInterval = setInterval(() => {
            timeLeft--; updateTimerUI();
            if (timeLeft <= 0) { clearInterval(timerInterval); checkAnswer(-1, currentSet[currentIdx]); }
        }, 1000);
    }

    function updateTimerUI() {
        const bar = document.getElementById('timer-bar');
        const num = document.getElementById('timer-num');
        bar.style.width = (timeLeft / 30 * 100) + "%";
        num.innerText = timeLeft;
        if (timeLeft <= 5) num.classList.add('urgent-text');
        else num.classList.remove('urgent-text');
    }

    function checkAnswer(selected, q) {
        clearInterval(timerInterval);
        const isCorrect = (selected == q.answer);
        const quizScreen = document.getElementById('quiz-screen');
        const circle = document.getElementById('circle-anime');
        
        if (isCorrect) {
            sndCorrect.currentTime = 0; sndCorrect.play().catch(e => {});
            circle.classList.add('run-anime');
            setTimeout(() => circle.classList.remove('run-anime'), 600);
            if (!isRetryMode) setCorrectCount++; // 初回挑戦のみカウント
        } else {
            sndWrong.currentTime = 0; sndWrong.play().catch(e => {});
            quizScreen.classList.add('shake');
            if (!isRetryMode) wrongQuestions.push(q);
        }
        const rb = document.getElementById('result-box');
        rb.classList.remove('hidden');
        rb.className = `result ${isCorrect ? 'correct' : 'wrong'}`;
        document.getElementById('ans-status').innerText = isCorrect ? "⭕ 正解！" : "❌ 不正解";
        document.getElementById('ans-desc').innerText = "解説: " + q.explanation;
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
    }

    function nextStep() {
        currentIdx++;
        if (currentIdx < currentSet.length) renderQuestion();
        else showCheckpoint();
    }

    function showCheckpoint() {
        fadeBgm(MIN_BGM_VOL, 1000);
        
        // 初回モードの時のみ通算記録を保存
        if (!isRetryMode) {
            saveStats(currentSet.length, setCorrectCount);
        }

        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('timer-ui').classList.add('hidden');
        document.getElementById('checkpoint-screen').classList.remove('hidden');
        
        const setRate = Math.round((setCorrectCount / currentSet.length) * 100);
        document.getElementById('checkpoint-stats').innerHTML = 
            `<span style="font-size:14px; color:var(--gray)">このセットの結果</span><br>` +
            `${currentSet.length}問中 ${setCorrectCount}問正解！ (${setRate}%)`;
            
        document.getElementById('retry-section').className = (!isRetryMode && wrongQuestions.length > 0) ? '' : 'hidden';
    }

    function startRetry() {
        isRetryMode = true; currentSet = [...wrongQuestions]; wrongQuestions = []; currentIdx = 0; showQuiz();
    }

    function continueNext() { startNewSet(); }
    function goBack() { clearInterval(timerInterval); location.reload(); }
</script>
</body>
</html>
